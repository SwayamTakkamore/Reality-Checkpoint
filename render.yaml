services:
  - type: web
    name: reality-checkpoint-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REALITY_DISABLE_OLLAMA
        value: "1"
      # On Render Free Tier (512MB RAM), set REALITY_DISABLE_HF=1 to run fast, zero-crash
      # heuristic game engine without OOM. On Render GPU/high-memory instances, set to "0".
      - key: REALITY_DISABLE_HF
        value: "1"
